server {
  listen 80;
  root /usr/share/nginx/html;

  # The API serves /products, /cart, ..., the same paths as the SPA's screens,
  # so the SPA calls it under /api and the trailing / strips the prefix:
  # /api/cart reaches the API's /cart.
  location /api/ {
    proxy_pass http://api:4000/;
  }

  # The SPA routes every other path itself.
  location / {
    try_files $uri /index.html;
  }
}
