# The shop with its frontend, for running browser checks against it.
# The secrets here are for this local stack only.
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: storefront
      POSTGRES_PASSWORD: storefront
      POSTGRES_DB: storefront
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "storefront"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://storefront:storefront@db:5432/storefront
      REDIS_URL: redis://redis:6379
      # actors.json holds tokens signed with this secret; change both together.
      JWT_SECRET: storefront-dev-jwt-secret
      PAYMENT_WEBHOOK_SECRET: storefront-dev-webhook-secret
      PORT: "4000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/categories').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 2s
      retries: 60
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  web:
    build: ./web
    # The only service that publishes a port, so a run takes it for the app.
    # No host port: Docker picks a free one, so parallel runs never collide.
    ports:
      - "80"
    depends_on:
      api:
        condition: service_healthy
